name: MetricProof checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: genvm-lint check contracts/metric_proof.py
      - name: Reuse verified runtime archive for direct tests
        run: |
          mkdir -p ~/.cache/gltest-direct
          cp ~/.cache/genvm-linter/genvm-universal-*.tar.xz ~/.cache/gltest-direct/
      - run: python -m pytest -p no:gltest tests/test_contract.py -q
